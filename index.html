<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nastis Dynamic Island</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Container trung tâm của Dynamic Island -->
  <div id="island" class="compact" title="Nhấp chuột để mở rộng">
    
    <!-- TRẠNG THÁI THU GỌN (COMPACT MODE) -->
    <div class="view-compact">
      <!-- Khi KHÔNG có nhạc -->
      <div id="compact-normal" class="compact-layout-wrapper">
        <div class="compact-left">
          <span id="compact-time">CPU 0%</span>
        </div>
        <div class="compact-right">
          <span id="compact-ram">RAM 0%</span>
        </div>
      </div>
      
      <!-- Khi CÓ nhạc đang phát/tạm dừng -->
      <div id="compact-media" class="compact-layout-wrapper" style="display: none;">
        <span id="compact-media-status-btn" class="compact-play-btn" title="Phát/Tạm dừng"></span>
        <div class="compact-marquee-container">
          <div class="marquee-track">
            <span id="compact-media-title" class="marquee-text">Không có nhạc</span>
            <span id="compact-media-title-2" class="marquee-text">Không có nhạc</span>
          </div>
        </div>
        <div class="compact-media-right">
          <span id="compact-ram-media">0%</span>
        </div>
      </div>
    </div>

    <!-- TRẠNG THÁI MỞ RỘNG (EXPANDED MODE) -->
    <div class="view-expanded">
      
      <!-- Hàng đầu tiên: Tiêu đề & Nút đóng nhanh -->
        <div class="expanded-header">
          <div class="header-left">
            <button id="btn-uninstall" class="action-btn uninstall" title="Gỡ cài đặt Dynamic Island" style="display: none;">
              <svg viewBox="0 0 24 24" fill="currentColor" width="10" height="10"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            </button>
          </div>
          <div class="header-actions">
            <button id="btn-taskmgr" class="action-btn" title="Mở Task Manager">
              <svg viewBox="0 0 24 24" fill="currentColor" width="11" height="11"><path d="M3 14h4v7H3zm7-7h4v14h-4zm7-3h4v17h-4z"/></svg>
            </button>
            <button id="btn-close" class="action-btn close" title="Đóng ứng dụng">✕</button>
          </div>
        </div>

      <!-- Nội dung chính: Widget Media Player (trái) và CPU/RAM (phải) -->
      <div class="expanded-content">
        <!-- Widget trình phát nhạc (media-widget) -->
        <div class="widget media-widget">
          <div class="media-info-container">
            <div class="media-art-container">
              <img id="media-art" class="media-art" alt="">
            </div>
            <div class="media-details">
              <div class="media-title" id="media-title">Không có nhạc</div>
              <div class="media-artist" id="media-artist">Dừng</div>
            </div>
          </div>
          <div class="media-progress" id="media-progress">
            <div class="media-progress-track-wrap">
              <div class="media-progress-track" id="media-progress-track">
                <div class="media-progress-fill" id="media-progress-fill"></div>
              </div>
              <span class="media-progress-thumb" id="media-progress-thumb"></span>
            </div>
            <span class="media-time" id="media-time">0:00 / 0:00</span>
          </div>
          <div class="media-controls">
            <button id="btn-prev" class="media-btn" title="Bài trước">
              <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
            </button>
            <button id="btn-play" class="media-btn play" title="Phát/Tạm dừng">
              <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button id="btn-next" class="media-btn" title="Bài tiếp theo">
              <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M6 18l8.5-6L6 6zm9-12v12h2V6z"/></svg>
            </button>
          </div>
        </div>

        <!-- Widget tài nguyên hệ thống -->
        <div class="widget stats-widget">
          <div class="stat-column">
            <div class="chili-bars" id="chili-cpu"></div>
            <div class="gauge">
              <svg class="gauge-svg" viewBox="0 0 100 52">
                <path class="gauge-track" d="M 8 50 A 42 42 0 0 1 92 50"/>
                <path class="gauge-fill" id="gauge-fill-cpu" d="M 8 50 A 42 42 0 0 1 92 50"/>
              </svg>
              <div class="gauge-value" id="gauge-val-cpu">0%</div>
              <div class="gauge-label">CPU</div>
            </div>
          </div>
          <div class="stat-column">
            <div class="chili-bars" id="chili-ram"></div>
            <div class="gauge">
              <svg class="gauge-svg" viewBox="0 0 100 52">
                <path class="gauge-track" d="M 8 50 A 42 42 0 0 1 92 50"/>
                <path class="gauge-fill" id="gauge-fill-ram" d="M 8 50 A 42 42 0 0 1 92 50"/>
              </svg>
              <div class="gauge-value" id="gauge-val-ram">0%</div>
              <div class="gauge-label">RAM</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Hàng cuối: Cài đặt khởi động cùng Win -->
      <div class="expanded-footer">
        <label class="switch-container">
          <input type="checkbox" id="chk-autostart">
          <span class="slider"></span>
          <span class="switch-label">Tự khởi động cùng Windows</span>
        </label>
      </div>

    </div>

  </div>

  <script src="renderer.js"></script>
</body>
</html>
